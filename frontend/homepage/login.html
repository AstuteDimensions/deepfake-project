<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepGuard AI | Deepfake Detector</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="background">
        <span></span>
        <span></span>
        <span></span>
    </div>


    <main class="container">

        <section class="brand">
            <div class="logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <h1>DeepGuard AI</h1>

            <p>
                Advanced AI-powered deepfake detection platform.
                Detect manipulated images, videos and media with confidence.
            </p>
        </section>


        <section class="login-card">

            <h2>Welcome Back</h2>
            <p class="subtitle">
                Login to access your detection dashboard
            </p>


            <form id="loginForm">

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input 
                        type="text"
                        placeholder="Username"
                        required>
                </div>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input 
                        id="password"
                        type="password"
                        placeholder="Password"
                        required>

                    <i 
                        class="fa-solid fa-eye"
                        id="togglePassword">
                    </i>

                </div>


                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button class="login-btn">
                    Sign In
                </button>


                <div class="divider">
                    <span></span>
                    OR
                    <span></span>
                </div>


                <button type="button" class="social">
                    <i class="fa-brands fa-google"></i>
                    Continue with Google
                </button>


                <p class="signup">
                    Don't have an account?
                    <a href="#">
                        Create Account
                    </a>
                </p>


            </form>

        </section>


    </main>


<script src="script.js"></script>

</body>
</html>
